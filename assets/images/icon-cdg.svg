     font-weight="900" text-anchor="middle">
    <text x="512" y="600" font-size="360" letter-spacing="-18">CDG</text>
  </g>

  <!-- Subtitle -->
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700"
     text-anchor="middle" opacity="0.92">
