<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat vibrant green background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#18A64B"/>

  <g transform="translate(0,-26)" fill="none" stroke="none">
    <!-- Top cap / pole tip -->
    <circle cx="512" cy="235" r="22" fill="#FFFFFF"/>
    <rect x="503" y="250" width="18" height="72" rx="9" fill="#FFFFFF"/>

    <!-- Top hoop (chains attach here) -->
    <ellipse cx="512" cy="322" rx="120" ry="26" fill="none" stroke="#FFFFFF" stroke-width="16"/>

    <!-- Chains -->
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
      <line x1="410" y1="340" x2="348" y2="452"/>
      <line x1="444" y1="346" x2="403" y2="452"/>
      <line x1="478" y1="348" x2="457" y2="452"/>
      <line x1="512" y1="349" x2="512" y2="452"/>
      <line x1="546" y1="348" x2="567" y2="452"/>
      <line x1="580" y1="346" x2="621" y2="452"/>
      <line x1="614" y1="340" x2="676" y2="452"/>
    </g>

    <!-- Basket cage -->
    <ellipse cx="512" cy="458" rx="170" ry="30" fill="#FFFFFF"/>
    <path d="M342 458 L682 458 L648 600 L376 600 Z" fill="#FFFFFF"/>
    <ellipse cx="512" cy="600" rx="136" ry="28" fill="#FFFFFF"/>
    <!-- Cage bar gaps -->
    <g fill="#18A64B">
      <rect x="400" y="468" width="12" height="128" rx="6"/>
      <rect x="455" y="470" width="12" height="132" rx="6"/>
      <rect x="510" y="470" width="12" height="134" rx="6"/>
      <rect x="565" y="470" width="12" height="132" rx="6"/>
      <rect x="620" y="468" width="12" height="128" rx="6"/>
    </g>

    <!-- Question-mark pole (the CrAzY twist) -->
    <path d="M455 700 C455 615 569 615 569 700 C569 752 512 758 512 815 L512 848"
          fill="none" stroke="#FFFFFF" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="905" r="31" fill="#FFFFFF"/>
  </g>
</svg>
